[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-musica-agent"
version = "3.3.0"
description = "Agente de atendimento híbrido para o desafio técnico AI Engineer"
authors = [
    { name = "Adriano Gomes", email = "adriannogs@gmail.com" }
]


requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3.0", "python-dotenv>=1.0,<2.0", "openai>=1.30,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
emporio-agent = "emporio_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
